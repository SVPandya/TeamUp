<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Google Maps 3D Test</title>
    <style>
        html,
        body,
        #map3d {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <div id="map3d"></div>

    <script>
        function loadGoogleMaps() {
            window.init = async function () {
                const { Map3DElement, MapMode } = await google.maps.importLibrary("maps3d");

                const map3DElement = new Map3DElement({
                    center: { lat: 40.748817, lng: -73.985428, altitude: 100 }, // Empire State Building
                    range: 2000,
                    tilt: 45,
                    heading: 0,
                    mode: MapMode.SATELLITE,
                });

                map3DElement.style.width = "100%";
                map3DElement.style.height = "100%";

                document.getElementById("map3d").appendChild(map3DElement);
            };

            const script = document.createElement("script");
            script.src = "https://maps.googleapis.com/maps/api/js?key=AIzaSyBpMWXUJA-S9Zy4QkCDCY2FJbEtwoAuaRk&v=beta&libraries=maps3d&callback=init";
            script.async = true;
            script.defer = true;
            document.head.appendChild(script);
        }

        loadGoogleMaps();
    </script>
</body>

</html>
